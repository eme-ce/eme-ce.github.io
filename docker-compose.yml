services:
  hugo:
    image: ghcr.io/gohugoio/hugo
    working_dir: /project
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        git config --global --add safe.directory /project &&
        git submodule update --init --recursive &&
        hugo server -D --bind 0.0.0.0 --port 1313 --baseURL http://localhost:${HUGO_PORT:-1313}/ --disableFastRender
    volumes:
      - .:/project
    ports:
      - "${HUGO_PORT:-1313}:1313"
